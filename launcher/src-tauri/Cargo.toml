[workspace]
members = [".", "crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"

[package]
name = "s2pipe-gui"
version.workspace = true
edition.workspace = true

[lib]
name = "s2pipe_gui"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "crates/gui/src/lib.rs"

[[bin]]
name = "s2pipe-gui"
path = "crates/gui/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
s2pipe-core = { path = "crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
