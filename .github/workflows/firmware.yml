name: firmware

on:
    push:
        tags: ["v*"]
    pull_request:
        paths:
            - "firmware/**"
            - ".github/workflows/firmware.yml"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install ARM toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

            - name: Checkout Pico SDK
              uses: actions/checkout@v4
              with:
                  repository: raspberrypi/pico-sdk
                  ref: 2.1.1
                  path: pico-sdk
                  submodules: true

            - name: Build
              env:
                  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
              run: |
                  cmake -S firmware -B firmware/build -DPICO_BOARD=pico2_w
                  cmake --build firmware/build

            - name: Upload UF2
              uses: actions/upload-artifact@v4
              with:
                  name: s2pipe_pico
                  path: firmware/build/s2pipe_pico.uf2

            - name: Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: firmware/build/s2pipe_pico.uf2
