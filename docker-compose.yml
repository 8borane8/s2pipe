name: s2pipe

services:
    media:
        profiles: ["all", "node"]
        restart: unless-stopped
        init: true
        build:
            context: .
            dockerfile: docker/Dockerfile.media
        ports:
            - "${MEDIA_ICE_PORT}:${MEDIA_ICE_PORT}/udp"
            - "${MEDIA_ICE_PORT}:${MEDIA_ICE_PORT}/tcp"
        # Linux and Windows (after usb.ps1): capture card + UART. Replaces a single
        # /dev/video0 device map so Compose still starts with CAPTURE_SOURCE=test.
        privileged: true
        volumes:
            - /dev:/dev
        environment:
            MEDIA_ICE_IP: ${MEDIA_ICE_IP}
            MEDIA_ICE_PORT: ${MEDIA_ICE_PORT}
            CAPTURE_SOURCE: ${CAPTURE_SOURCE}
            CAPTURE_DEVICE: ${CAPTURE_DEVICE}
            CAPTURE_AUDIO: ${CAPTURE_AUDIO}
            CAPTURE_FORMAT: ${CAPTURE_FORMAT:-mjpeg}
            CAPTURE_WIDTH: ${CAPTURE_WIDTH}
            CAPTURE_HEIGHT: ${CAPTURE_HEIGHT}
            CAPTURE_FPS: ${CAPTURE_FPS}
            FFMPEG_ENCODER: ${FFMPEG_ENCODER}
            FFMPEG_EXTRA: ${FFMPEG_EXTRA}

    node:
        profiles: ["all", "node"]
        restart: unless-stopped
        depends_on:
            - media
        build:
            context: .
            dockerfile: docker/Dockerfile.node
        ports:
            - "${NODE_PORT}:${NODE_PORT}"
        # Same /dev map as media (Pico UART = /dev/ttyUSB0)
        privileged: true
        volumes:
            - /dev:/dev
        environment:
            NODE_PORT: ${NODE_PORT}
            MEDIA_HOST: media
            CAPTURE_SOURCE: ${CAPTURE_SOURCE}
            PICO_SERIAL: ${PICO_SERIAL}

    client:
        profiles: ["all", "client"]
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/Dockerfile.client
        ports:
            - "${CLIENT_PORT}:${CLIENT_PORT}"
        environment:
            CLIENT_PORT: ${CLIENT_PORT}
            NODE_BASE_URL: ${NODE_BASE_URL}
